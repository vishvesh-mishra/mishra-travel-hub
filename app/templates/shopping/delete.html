{% extends "base.html" %}

{% block content %}
  <div class="pg-head">
    <a class="pg-head__back" href="{{ url_for('shopping.for_trip', trip_id=trip.id) }}" aria-label="Back">
      <i class="bi bi-chevron-left" aria-hidden="true"></i>
    </a>
    <div class="pg-head__body">
      <p class="pg-head__context">{{ trip.name }} · Shopping</p>
      <h1 class="pg-head__title">Delete Item</h1>
    </div>
  </div>

  <div class="danger-card">
    <div class="danger-card__icon"><i class="bi bi-trash3" aria-hidden="true"></i></div>
    <p class="danger-card__title">Delete this item?</p>
    <p class="danger-card__item">{{ item.item_name }}</p>
    <p class="danger-card__desc">This removes the item from {{ trip.name }}.</p>
    <form method="post">
      {{ form.hidden_tag() }}
      <div class="danger-card__actions">
        {{ form.submit(class="btn btn-danger btn-sm") }}
        <a class="btn btn-outline-light btn-sm" href="{{ url_for('shopping.for_trip', trip_id=trip.id) }}">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
