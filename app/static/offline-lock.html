<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Locked — Mishra Travel Hub</title>
  <style>
    :root { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #101114;
      color: rgba(255,255,255,0.88);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem 1.5rem;
      padding-top: calc(2rem + env(safe-area-inset-top));
      padding-bottom: calc(2rem + env(safe-area-inset-bottom));
    }
    .card { text-align: center; max-width: 340px; width: 100%; }
    .icon {
      width: 64px; height: 64px; border-radius: 16px;
      margin: 0 auto 1.5rem;
      display: block;
    }
    .lock {
      font-size: 1.75rem;
      display: block;
      margin-bottom: 1rem;
      opacity: 0.5;
    }
    h1 {
      font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em;
      margin-bottom: 0.375rem;
    }
    h2 {
      font-size: 0.875rem; font-weight: 600;
      color: rgba(255,255,255,0.55);
      margin-bottom: 1rem;
    }
    p {
      font-size: 0.875rem; color: rgba(255,255,255,0.42);
      line-height: 1.65; margin-bottom: 2rem;
    }
    .retry {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.625rem 1.75rem;
      background: rgba(13,110,253,0.16);
      border: 1px solid rgba(13,110,253,0.32);
      color: #6ea8fe; border-radius: 999px;
      font-size: 0.875rem; font-weight: 600;
      text-decoration: none; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .retry:active { transform: scale(0.96); opacity: 0.8; }
  </style>
</head>
<body>
  <div class="card">
    <img class="icon" src="/static/icons/icon-192.png" alt="" width="64" height="64">
    <span class="lock" aria-hidden="true">🔒</span>
    <h1>Mishra Travel Hub</h1>
    <h2>Offline Access Locked</h2>
    <p>Connect to the internet and sign in once to enable offline travel access.</p>
    <a href="/" class="retry" id="retryBtn">Retry</a>
  </div>
  <script>
    document.getElementById('retryBtn').addEventListener('click', function () {
      if (navigator.vibrate) navigator.vibrate(8);
    });
  </script>
</body>
</html>
