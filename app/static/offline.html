<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline — Mishra Travel Hub</title>
  <style>
    :root { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #101114;
      color: rgba(255,255,255,0.88);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem 1.5rem;
      padding-bottom: calc(2rem + env(safe-area-inset-bottom));
    }
    .card {
      text-align: center;
      max-width: 340px;
      width: 100%;
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 1.5rem;
      display: block;
      opacity: 0.45;
    }
    h1 {
      font-size: 1.375rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.9375rem;
      color: rgba(255,255,255,0.42);
      line-height: 1.65;
      margin-bottom: 2rem;
    }
    .divider {
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin-bottom: 1.5rem;
    }
    .hint {
      font-size: 0.8125rem;
      color: rgba(255,255,255,0.3);
      margin-bottom: 1.25rem;
    }
    .retry {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.625rem 1.5rem;
      background: rgba(13,110,253,0.16);
      border: 1px solid rgba(13,110,253,0.32);
      color: #6ea8fe;
      border-radius: 999px;
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .retry:active { transform: scale(0.96); opacity: 0.8; }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon" aria-hidden="true">✈️</span>
    <h1>You're offline</h1>
    <p>Looks like you're in flight mode.<br>Recently visited pages are available below.</p>
    <div class="divider"></div>
    <p class="hint">Tap a link you've visited before, or retry when you have a connection.</p>
    <a href="/" class="retry" onclick="window.location.reload()">
      Try Again
    </a>
  </div>
</body>
</html>
